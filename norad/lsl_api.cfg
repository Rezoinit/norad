; LSL settings for norad: keep all stream traffic inside this computer, so switching
; WiFi (e.g. to the Tobii glasses' network) cannot break connections.
; Discovery uses a multicast group on the loopback interface: every process on this
; computer (app, Polar, PsychoPy, LabRecorder) receives it. (Plain machine scope uses
; 127.0.0.1 unicast, which macOS delivers to only one of several processes.)
[ports]
IPv6 = disable

[multicast]
ResolveScope = machine
MachineAddresses = {224.0.0.183}
Interfaces = {127.0.0.1}
